name: Audit TODO extraction

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Audit
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          MAIN="266cbc22215201a93c02e37200fe32be98a9e931"
          readme=Path('README.md').read_text()
          rx=re.compile(r'^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<msg>.*)$',re.M)
          base=[(m.group('path'),int(m.group('line')),m.group('msg')) for m in rx.finditer(readme)]
          print('README entries',len(base))
          print('raw checkbox lines',sum(1 for l in readme.splitlines() if l.startswith('- [ ]')))
          print('title count',readme.count('### 📝 Complete TODO List'))
          print('sorted?', base==sorted(base,key=lambda x:(x[0],x[1])))

          def extract(path, text):
              out=[]
              for i,l in enumerate(text.splitlines(),1):
                  if 'TODO' in l:
                      msg=re.sub(r'^[\s:]+','',l.split('TODO',1)[1]).strip()
                      out.append((path,i,msg))
              return out

          for rev in [MAIN,'HEAD']:
              files=subprocess.check_output(['git','ls-tree','-r','--name-only',rev],text=True).splitlines()
              pys=[p for p in files if p.endswith('.py')]
              allitems=[]
              marker_count=0
              for p in pys:
                  try: txt=subprocess.check_output(['git','show',f'{rev}:{p}'],text=True)
                  except subprocess.CalledProcessError: continue
                  marker_count += sum('TODO' in l for l in txt.splitlines())
                  allitems += extract(p,txt)
              print('\nREV',rev)
              print('py files',len(pys),'TODO lines',marker_count,'extracted',len(allitems))
              from collections import Counter
              c=Counter(p for p,_,_ in allitems)
              cb=Counter(p for p,_,_ in base)
              print('files with TODO',len(c),'README paths',len(cb))
              print('TODO paths missing from README:',sorted(set(c)-set(cb)))
              for p in sorted(set(c)-set(cb)):
                  print(' MISSING PATH',p,c[p])
              print('README paths without code TODO:',sorted(set(cb)-set(c)))
              for p in sorted(set(cb)-set(c)):
                  print(' EXTRA PATH',p,cb[p])
              # Compare common paths using main baseline only for main
              if rev==MAIN:
                  bs=set(base)
                  cs=set(allitems)
                  print('in code not README',len(cs-bs))
                  for x in sorted(cs-bs)[:100]: print('  CODE-ONLY',x)
                  print('in README not code',len(bs-cs))
                  for x in sorted(bs-cs)[:100]: print('  README-ONLY',x)
                  # count mismatch by path
                  for p in sorted(set(c)|set(cb)):
                      a=[x for x in allitems if x[0]==p]
                      b=[x for x in base if x[0]==p]
                      if a!=b:
                          print('PATH DIFF',p,'code',len(a),'readme',len(b))
          PY
